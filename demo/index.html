<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>

:root[data-theme="dark"]{--bg:#0d0c26;--surface:#17163a;--ink:#eeedf7;--muted:#a3a2bd;--line:#2c2b55;--soft:#211f4a;--navy:#07061a;--good:#58c98c;--bad:#ff8a80;--warn:#e8b64a;--btn:#bfbb45;--btnfg:#110f43;--c1:#8f8cf0;--c2:#bfbb45;color-scheme:dark}

.rail button:hover{background:#ffffff1a}.rail button[aria-current=page]{background:var(--gold);color:#110f43}.rail .sp{flex:1}
.rail select{background:#ffffff1a;width:100%}.rail select option{color:#111}.rail small{color:#ffffffa0;font-size:12px;padding:0 4px}
main{padding:20px clamp(14px,3vw,30px);min-width:0}h1{margin:0;font-size:23px;font-weight:800}

td.n{white-space:nowrap}.yl td,td.yl{background:var(--yel);color:#17163a;font-weight:700}.bl td,td.bl{background:var(--blue);color:#fff;font-weight:700}
.btn{all:unset;box-sizing:border-box;cursor:pointer;background:var(--btn);color:var(--btnfg);padding:7px 15px;border-radius:9px;font:700 13.5px var(--f)}

.kpi.h{background:var(--navy);color:#fff;border-color:var(--navy)}.kpi.h span{color:#ffffffb0}.kpi.h b{color:var(--gold)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.sum div{border:1px solid var(--line);margin:0 0 -1px -1px}.sum small{display:block;background:var(--blue);color:#fff;padding:2px 10px;font-weight:700;font-size:12px}.sum b{display:block;padding:5px 10px;font-size:17px;background:var(--surface)}.sum .h b{background:var(--yel);color:#17163a}
dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 20px;margin:0}dl div{display:flex;gap:6px}dt{color:var(--muted);font-weight:600}dd{margin:0;font-weight:700}
.modal{position:fixed;inset:0;background:#000a;overflow:auto;display:grid;place-items:start center;padding:18px 14px;z-index:9}
.sheet{background:#fff;color:#111;width:min(640px,100%);padding:26px;border-radius:6px;border-top:8px solid var(--c,#110f43)}.sheet table td,.sheet table th{border-color:#ddd;background:#fff;color:#111}.sheet table th{background:#f2f2f2}
.sheet header{display:flex;justify-content:space-between;gap:10px;border-bottom:2px solid #ddd;padding-bottom:10px;margin-bottom:12px;flex-wrap:wrap}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);max-width:calc(100% - 28px);background:var(--navy);color:#fff;padding:9px 18px;border-radius:10px;z-index:20;font-weight:700}.toast.e{background:var(--bad)}
.empty{color:var(--muted);text-align:center;padding:18px}.note{background:var(--soft);border-radius:9px;padding:8px 12px;color:var(--muted);font-size:13px}
@media(max-width:1150px){.g3{grid-template-columns:1fr}}@media(max-width:820px){.app{grid-template-columns:1fr}.rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.brand{border:0;padding:0;margin:0 6px 0 0}.rail .sp{display:none}.g2{grid-template-columns:1fr}}
</style>

<script>
document.documentElement.lang='ar';document.documentElement.dir='rtl';
const $=s=>document.querySelector(s);
/* ===== الصلاحيات (مطابقة لـ web/src/lib/rbac.ts) ===== */
const ALL=['booking:view','booking:create','booking:update','booking:cancel','baseExpense:edit','extra:edit','coordination:edit','payment:create','payment:void','report:view'];
const ROLES={MANAGER:['مدير القاعة',ALL],ACCOUNTANT:['محاسب',ALL],RECEPTION:['موظف استقبال',['booking:view','booking:create','booking:update','payment:create']],COORDINATOR:['مشرفة التنسيق',['booking:view','coordination:edit']]};
let role='MANAGER';const can=p=>ROLES[role][1].includes(p);
/* ===== المبالغ بالهللات (مطابقة لـ money.ts / finance.ts) ===== */
const H=v=>Math.round(Number(v)*100),R=h=>h/100,sum=a=>R(a.reduce((s,v)=>s+H(v),0)),sub=(a,b)=>R(H(a)-H(b));
const nf=new Intl.NumberFormat('ar-SA-u-nu-latn',{maximumFractionDigits:2}),money=v=>nf.format(Number(v))+' ر.س';
function totals(b){const act=b.payments.filter(p=>p.status==='ACTIVE'),rental=+b.rental,base=sum(b.base.map(x=>x.amount)),exC=sum(b.extras.map(x=>x.charged)),exK=sum(b.extras.map(x=>x.cost)),cA=b.coord?+b.coord.amount:0,cE=b.coord?sum(b.coord.exp.map(x=>x.amount)):0;
 const paid=sum(act.map(p=>p.amount)),hallPaid=sum(act.filter(p=>p.kind==='HALL').map(p=>p.amount)),coPaid=sum(act.filter(p=>p.kind==='COORD').map(p=>p.amount)),rev=sum([rental,exC,cA]),exp=sum([base,exK,cE]),hallDue=sum([rental,exC]);
 return{rental,base,rentalNet:sub(rental,base),exC,exK,exNet:sub(exC,exK),cA,cE,cNet:sub(cA,cE),rev,exp,net:sub(rev,exp),paid,rem:sub(rev,paid),hallRem:sub(hallDue,hallPaid),coRem:sub(cA,coPaid),coPaid}}
/* ===== التواريخ ===== */
const D=s=>new Date(s+'T12:00:00Z'),iso=d=>d.toISOString().slice(0,10),add=(s,n)=>iso(new Date(D(s).getTime()+n*864e5)),todayS=()=>new Date().toISOString().slice(0,10);
const fmt=(l,o)=>new Intl.DateTimeFormat(l,{...o,timeZone:'UTC'});
const hij=s=>fmt('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'}).format(D(s)),greg=s=>fmt('ar-SA-u-ca-gregory-nu-latn',{day:'numeric',month:'long',year:'numeric'}).format(D(s));

const SEC={BOTH:'قسمين',MEN_ONLY:'رجال فقط',WOMEN_ONLY:'نساء فقط'},ST={TENTATIVE:['مبدئي','wr'],CONFIRMED:['مؤكد','ok'],COMPLETED:['منتهي',''],CANCELLED:['ملغي','bd']},PM={CASH:'كاش',CARD:'شبكة',BANK_TRANSFER:'تحويل بنكي'},KIND={HALL:'قصر ليالي الديار',COORD:'شركة زوايا المعالي'};

const empty=()=>({halls:[{id:1,name:'قاعة ليالي الديار'}],clients:[],bookings:[],seq:{c:0,k:0,hall:0,co:0},audit:[]});
function nextNo(k,p){S.seq[k]++;return p+'-'+String(S.seq[k]).padStart(4,'0')}
function mk(o){let c=S.clients.find(x=>x.phone===o.phone);if(!c){c={id:S.clients.length+1,name:o.name,phone:o.phone};S.clients.push(c)}
 const b={id:S.bookings.length+1,no:o.no||nextNo('c','ع'),clientId:c.id,hallId:1,date:o.date,section:o.section,rental:o.rental,status:'TENTATIVE',notes:'',base:[],extras:[],coord:o.coord?{no:nextNo('k','ف'),amount:o.coord,exp:[]}:null,payments:[],seq:0};S.bookings.push(b);return b}
function pay(b,kind,method,amount,date){const no=kind==='HALL'?nextNo('hall','ل'):nextNo('co','ز');b.payments.push({id:Date.now()+Math.random(),no,kind,method,amount:String(amount),date:date||todayS(),status:'ACTIVE'})}
function seed(blank){S=empty();if(blank)return;
 const a=mk({name:'محمد العتيبي',phone:'0551234567',date:add(todayS(),6),section:'BOTH',rental:'17000',coord:'12200'});a.status='CONFIRMED';pay(a,'HALL','BANK_TRANSFER',5100);pay(a,'COORD','CARD',3660);
 mk({name:'فهد الدوسري',phone:'0533344556',date:add(todayS(),20),section:'MEN_ONLY',rental:'12000'}).payments.length||0;
 const c=mk({name:'عمر الشمري',phone:'0544455667',date:add(todayS(),45),section:'BOTH',rental:'20000',coord:'9000'});}
function load(){try{const j=localStorage.getItem(KEY);if(j){S=JSON.parse(j);return}}catch(e){}seed()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const cl=b=>S.clients.find(c=>c.id===b.clientId),hallN=b=>S.halls.find(h=>h.id===b.hallId).name;
/* ===== الحالة والواجهة ===== */
let ui={view:'calendar',mode:'month',m:todayS().slice(0,7),d:todayS(),hall:'',status:'',q:'',bid:null,nd:'',dh:'',df:todayS().slice(0,4)+'-01-01',dt:todayS().slice(0,4)+'-12-31'};
const NAV=[['calendar','التقويم'],['bookings','الحجوزات'],['dashboard','التقارير المالية']];
function nav(){$('#rail').innerHTML=`<div class="brand"><div class="mono">ق</div><div>ليالي الديار<br>وزوايا المعالي</div></div>`+NAV.filter(([k])=>k!=='dashboard'||can('report:view')).map(([k,t])=>`<button data-v="${k}" ${ui.view===k||(k==='bookings'&&['card','new'].includes(ui.view))?'aria-current="page"':''}>${t}</button>`).join('')+`<div class="sp"></div><small>الدور (للتجربة)</small><select id="role" aria-label="الدور">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${k===role?'selected':''}>${v[0]}</option>`).join('')}</select><button data-v="theme">الوضع الداكن / الفاتح</button><button data-v="reset">بيانات تجريبية</button><button data-v="blank">بيانات فارغة</button>`}
const tag=b=>`<span class="tag ${ST[b.status][1]}">${ST[b.status][0]}</span>`;
function toast(t,e){const x=document.createElement('div');x.className='toast'+(e?' e':'');x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),3200)}
const bk=id=>S.bookings.find(b=>b.id===id);
function filtered(f){return S.bookings.filter(b=>(!f.hall||b.hallId===+f.hall)&&(!f.status||b.status===f.status)&&(!f.from||b.date>=f.from)&&(!f.to||b.date<=f.to)&&(!f.q||(b.no+cl(b).name+cl(b).phone).includes(f.q)))}
const filterBar=(extra)=>`<div class="card"><form class="f" id="ff" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${extra||''}<label>القاعة<select id="f-h"><option value="">كل القاعات</option>${S.halls.map(h=>`<option value="${h.id}" ${ui.hall==h.id?'selected':''}>${h.name}</option>`).join('')}</select></label><label>حالة الحجز<select id="f-s"><option value="">كل الحالات</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${ui.status===k?'selected':''}>${v[0]}</option>`).join('')}</select></label><button class="btn g" type="submit">تصفية</button></form></div>`;
function V_calendar(){const week=ui.mode==='week',days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];let cells,from,to,title;
 if(!week){const f=D(ui.m+'-01'),n=new Date(Date.UTC(f.getUTCFullYear(),f.getUTCMonth()+1,0)).getUTCDate();cells=[...Array(f.getUTCDay()).fill(null),...Array.from({length:n},(_,i)=>add(ui.m+'-01',i))];from=ui.m+'-01';to=cells[cells.length-1];title=fmt('ar-SA-u-ca-gregory-nu-latn',{month:'long',year:'numeric'}).format(f)}
 else{const st=add(ui.d,-D(ui.d).getUTCDay());cells=Array.from({length:7},(_,i)=>add(st,i));from=st;to=add(st,6);title=greg(from)+' – '+greg(to)}
 const bs=filtered({hall:ui.hall,status:ui.status,from,to});
 return `<div class="top"><h1>التقويم والحجوزات</h1>${can('booking:create')?'<button class="btn" data-new="">إضافة حجز جديد</button>':''}</div><div class="stack">${filterBar()}
 <div class="card"><div class="top" style="margin-bottom:8px"><h2 style="margin:0">${title}</h2><span style="display:flex;gap:6px;flex-wrap:wrap"><span class="seg"><button data-mode="month" aria-pressed="${!week}">شهري</button><button data-mode="week" aria-pressed="${week}">أسبوعي</button></span><button class="btn g s" data-nav="-1">السابق</button><button class="btn g s" data-nav="0">اليوم</button><button class="btn g s" data-nav="1">التالي</button></span></div>
 <div class="tw"><div class="cal ${week?'wk':''}">${days.map(d=>`<div class="dn">${d}</div>`).join('')}${cells.map(d=>{if(!d)return '<div></div>';const l=bs.filter(b=>b.date===d);return `<div class="day ${d===todayS()?'t':''}"><header><span>${+d.slice(8)}</span>${week?`<span>${hij(d).split(' ').slice(0,2).join(' ')}</span>`:''}${can('booking:create')&&!l.length?`<button class="plus" data-new="${d}" aria-label="حجز جديد">+</button>`:''}</header>${l.map(b=>`<button class="chip ${b.status}" data-open="${b.id}" title="${esc(cl(b).name)} · ${SEC[b.section]}">${b.no} · ${esc(cl(b).name)}${week?`<br>${SEC[b.section]}`:''}</button>`).join('')}</div>`}).join('')}</div></div></div></div>`}
function V_bookings(){const rows=filtered({hall:ui.hall,status:ui.status,q:ui.q}).sort((a,b)=>a.date<b.date?-1:1),money_=can('payment:create')||can('report:view');
 return `<div class="top"><h1>الحجوزات</h1>${can('booking:create')?'<button class="btn" data-new="">إضافة حجز جديد</button>':''}</div><div class="stack">${filterBar(`<label>بحث (عميل، جوال، رقم عقد)<input id="f-q" value="${esc(ui.q)}"></label>`)}<div class="card"><div class="tw"><table><thead><tr><th>رقم العقد</th><th>العميل</th><th>القاعة</th><th>التاريخ</th><th>القسم</th><th>الحالة</th>${money_?'<th>الإجمالي</th><th>المتبقي</th>':''}</tr></thead><tbody>${rows.map(b=>{const t=totals(b);return `<tr><td><button class="btn s g" data-open="${b.id}">${b.no}</button></td><td>${esc(cl(b).name)}<br><small dir="ltr">${cl(b).phone}</small></td><td>${hallN(b)}</td><td class="n">${greg(b.date)}<br><small>${hij(b.date)}</small></td><td>${SEC[b.section]}</td><td>${tag(b)}</td>${money_?`<td class="n">${money(t.rev)}</td><td class="n">${b.status==='CANCELLED'?'—':money(t.rem)}</td>`:''}</tr>`}).join('')||'<tr><td colspan="8" class="empty">لا توجد حجوزات مطابقة</td></tr>'}</tbody></table></div></div></div>`}
function V_new(){return `<div class="top"><h1>حجز جديد</h1></div><div class="card" style="max-width:760px"><form class="f" id="fn"><label>اسم العميل<input name="name" required></label><label>رقم الجوال<input name="phone" required inputmode="tel" dir="ltr"></label><label>القاعة<select name="hall">${S.halls.map(h=>`<option value="${h.id}">${h.name}</option>`).join('')}</select></label><label>تاريخ الحفل<input name="date" type="date" value="${ui.nd}" required></label><label>نوع الحجز<select name="section"><option value="BOTH">قسمين</option><option value="MEN_ONLY">رجال فقط</option><option value="WOMEN_ONLY">نساء فقط</option></select></label><label>رقم العقد (فارغ = تلقائي)<input name="no"></label><label>مبلغ عقد الإيجار<input name="rental" inputmode="decimal" required></label><label>مبلغ التنسيق (اختياري)<input name="coord" inputmode="decimal"></label><button class="btn" type="submit">إنشاء الحجز</button></form></div>`}
const rowDel=(a,i,j)=>`<button class="btn d s" data-del="${a}" data-i="${i}" ${j!==undefined?`data-j="${j}"`:''}>حذف</button>`;
function V_card(){const b=bk(ui.bid),t=totals(b),open=b.status==='TENTATIVE'||b.status==='CONFIRMED',cb=open&&can('baseExpense:edit'),ce=open&&can('extra:edit'),cc=open&&can('coordination:edit')&&b.section!=='MEN_ONLY',cp=b.status!=='CANCELLED'&&can('payment:create'),seeM=can('payment:create')||can('report:view')||can('coordination:edit');

 <div class="g2"><div class="card"><h2>المدفوعات وتوزيع التحصيل</h2><div class="tw"><table><thead><tr><th>السند</th><th>الجهة</th><th>الدفع</th><th>التاريخ</th><th>المبلغ</th><th></th></tr></thead><tbody>${b.payments.map((p,i)=>`<tr ${p.status==='VOID'?'style="opacity:.55;text-decoration:line-through"':''}><td>${p.no}</td><td>${KIND[p.kind]}</td><td>${PM[p.method]}</td><td class="n">${p.date}</td><td class="n">${money(p.amount)}</td><td class="n">${p.status==='ACTIVE'?`<button class="btn g s" data-rc="${i}">سند</button> ${can('payment:void')?`<button class="btn d s" data-void="${i}">إلغاء</button>`:''}`:'<span class="tag bd">ملغى</span>'}</td></tr>`).join('')}<tr class="yl"><td colspan="4">إجمالي المحصّل</td><td class="n">${money(t.paid)}</td><td></td></tr><tr class="bl"><td colspan="4">المتبقي على العميل</td><td class="n">${b.status==='CANCELLED'?'—':money(t.rem)}</td><td></td></tr></tbody></table></div>

function V_dashboard(){const rows=filtered({hall:ui.dh,from:ui.df,to:ui.dt}).filter(b=>b.status!=='CANCELLED').map(b=>[b,totals(b)]),s=f=>sum(rows.map(([,t])=>f(t)));
 const mm={};rows.forEach(([b,t])=>{const k=b.date.slice(0,7);(mm[k]=mm[k]||{r:[],e:[]}).r.push(t.rev);mm[k].e.push(t.exp)});const pts=Object.keys(mm).sort().map(k=>({l:fmt('ar-SA-u-ca-gregory-nu-latn',{month:'short',year:'2-digit'}).format(D(k+'-01')),r:sum(mm[k].r),e:sum(mm[k].e)}));
 const mx=Math.max(1,...pts.flatMap(p=>[p.r,p.e])),step=Math.pow(10,Math.floor(Math.log10(mx))),top=Math.ceil(mx/step)*step,ticks=[0,.2,.4,.6,.8,1].map(x=>top*x),W=640,Hh=250,L=56,B=28,bw=Math.min(34,(W-L)/Math.max(pts.length,1)/2.6),gx=i=>L+(i+.5)*((W-L)/pts.length),y=v=>Hh-B-(v/top)*(Hh-B-12),cp=v=>new Intl.NumberFormat('ar-SA-u-nu-latn',{notation:'compact'}).format(v);
 const chart=pts.length?`<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="إيرادات ومصروفات كل شهر">${ticks.map(v=>`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${cp(v)}</text>`).join('')}${pts.map((p,i)=>`<rect x="${gx(i)-bw-1}" y="${y(p.r)}" width="${bw}" height="${Hh-B-y(p.r)}" rx="3" fill="var(--c1)"><title>الإيرادات ${money(p.r)}</title></rect><rect x="${gx(i)+1}" y="${y(p.e)}" width="${bw}" height="${Hh-B-y(p.e)}" rx="3" fill="var(--c2)"><title>المصروفات ${money(p.e)}</title></rect><text x="${gx(i)}" y="${Hh-8}" text-anchor="middle" font-size="12" fill="var(--ink)">${p.l}</text>`).join('')}</svg><p style="font-size:12.5px;color:var(--muted)"><span style="color:var(--c1)">■</span> الإيرادات &nbsp; <span style="color:var(--c2)">■</span> المصروفات</p>`:'<p class="empty">لا توجد بيانات في هذه الفترة</p>';
 const k=(l,v,h)=>`<div class="kpi ${h?'h':''}"><span>${l}</span><b>${v}</b></div>`;
 return `<div class="top"><h1>التقارير المالية</h1></div><div class="stack"><div class="card"><form class="f" id="fd"><label>القاعة<select id="d-h"><option value="">كل القاعات</option>${S.halls.map(h=>`<option value="${h.id}" ${ui.dh==h.id?'selected':''}>${h.name}</option>`).join('')}</select></label><label>من تاريخ<input id="d-f" type="date" value="${ui.df}"></label><label>إلى تاريخ<input id="d-t" type="date" value="${ui.dt}"></label><button class="btn" type="submit">عرض</button></form></div>
 <div class="kp">${k('إجمالي عقود الإيجار',money(s(t=>t.rental)))}${k('إجمالي عقود التنسيق',money(s(t=>t.cA)))}${k('إجمالي الزيادات',money(s(t=>t.exC)))}${k('إجمالي المصاريف',money(s(t=>t.exp)))}${k('إجمالي المحصّل',money(s(t=>t.paid)))}${k('المتبقي لدى العملاء',money(s(t=>t.rem)))}${k('عدد الحفلات',rows.length)}${k('صافي الربح الإجمالي',money(s(t=>t.net)),1)}</div><div class="card"><h2>إيرادات ومصروفات كل شهر (حسب تاريخ الحفل)</h2>${chart}</div></div>`}
const VIEWS={calendar:V_calendar,bookings:V_bookings,new:V_new,card:V_card,dashboard:V_dashboard};
function render(){if(ui.view==='dashboard'&&!can('report:view'))ui.view='calendar';if(ui.view==='new'&&!can('booking:create'))ui.view='calendar';nav();$('#main').innerHTML=VIEWS[ui.view]();save()}

function sheet(inner,c){$('#layer').innerHTML=`<div class="modal" data-close><div class="sheet" style="--c:${c}">${inner}<p style="display:flex;justify-content:space-between;align-items:center;margin-top:20px"><button class="btn g" data-close>إغلاق</button><small style="color:#666">معاينة. الطباعة وحفظ PDF متاحان في التطبيق الكامل.</small></p></div></div>`}
function printB(id){const b=bk(id),t=totals(b);sheet(`<header><div><h2 style="margin:0">قصر ليالي الديار</h2>ملخص عقد الحفل</div><div style="text-align:left"><b>${b.no}</b><br>${ST[b.status][0]}</div></header><p>العميل: <b>${esc(cl(b).name)}</b> · الجوال: <b dir="ltr">${cl(b).phone}</b><br>القاعة: <b>${hallN(b)}</b> · نوع الحجز: <b>${SEC[b.section]}</b><br>الميلادي: <b>${greg(b.date)}</b> · الهجري: <b>${hij(b.date)}</b></p><table><thead><tr><th>البيان</th><th>المبلغ</th></tr></thead><tbody><tr><td>مبلغ عقد الإيجار</td><td>${money(t.rental)}</td></tr>${b.extras.map(e=>`<tr><td>زيادة: ${esc(e.name)}</td><td>${money(e.charged)}</td></tr>`).join('')}${b.coord?`<tr><td>عقد التنسيق ${b.coord.no}</td><td>${money(t.cA)}</td></tr>`:''}<tr><td><b>الإجمالي</b></td><td><b>${money(t.rev)}</b></td></tr><tr><td>المدفوع</td><td>${money(t.paid)}</td></tr><tr><td><b>المتبقي</b></td><td><b>${money(t.rem)}</b></td></tr></tbody></table>`,'#110f43')}
function recB(i){const b=bk(ui.bid),p=b.payments[i],t=totals(b),hall=p.kind==='HALL';sheet(`<header><div><h2 style="margin:0">${KIND[p.kind]}</h2>${hall?'إيجار القاعة':'التنسيق والضيافة'}</div><div style="text-align:left"><b>سند قبض</b><br>${p.no}<br>${greg(p.date)}</div></header><p style="line-height:2">استلمنا من السيد/ة <b>${esc(cl(b).name)}</b><br>مبلغ وقدره <b>${money(p.amount)}</b> · طريقة الدفع: <b>${PM[p.method]}</b><br>وذلك عن عقد <b>${hall?b.no:b.coord.no}</b><br>المتبقي بعد هذا السند: <b>${money(hall?t.hallRem:t.coRem)}</b></p><p style="display:flex;justify-content:space-between;margin-top:30px"><span>المستلم</span><span>ختم الجهة</span></p>`,hall?'#110f43':'#9a3b6b')}
/* ===== العمليات (تُفحص الصلاحيات هنا كما في الخادم) ===== */
class E extends Error{}
const need=p=>{if(!can(p))throw new E('ليست لديك صلاحية لتنفيذ هذا الإجراء')};
const amt=(v,l,pos=true)=>{v=String(v).trim();if(!/^\d+(\.\d{1,2})?$/.test(v)||Number(v)>1e7||(pos&&!Number(v)))throw new E(l+' غير صالح');return v};
const editable=b=>{if(b.status==='CANCELLED')throw new E('الحجز ملغي ولا يمكن تعديله');if(b.status==='COMPLETED')throw new E('الحجز منتهٍ ولا يمكن تعديله')};
function doForm(f,fd){const b=ui.bid?bk(ui.bid):null,g=k=>(fd.get(k)||'').toString().trim();
 if(f==='base'){need('baseExpense:edit');editable(b);b.base.push({name:g('name'),amount:amt(g('amount'),'المبلغ')})}
 if(f==='extra'){need('extra:edit');editable(b);b.extras.push({name:g('name'),charged:amt(g('charged'),'المبلغ'),cost:amt(g('cost')||'0','الصرف',false)})}
 if(f==='cexp'){need('coordination:edit');editable(b);if(!b.coord)throw new E('لا يوجد عقد تنسيق');b.coord.exp.push({name:g('name'),amount:amt(g('amount'),'المبلغ')})}
 if(f==='coamt'){need('coordination:edit');editable(b);if(b.section==='MEN_ONLY')throw new E('الحجز للرجال فقط ولا يقبل عقد تنسيق');const a=amt(g('amount'),'مبلغ التنسيق');if(b.coord){if(H(a)<H(totals(b).coPaid))throw new E('المبلغ أقل من المدفوع على التنسيق');b.coord.amount=a}else b.coord={no:nextNo('k','ف'),amount:a,exp:[]}}
 if(f==='notes'){need('booking:update');editable(b);b.notes=g('notes').slice(0,4000)}
 if(f==='pay'){need('payment:create');if(b.status==='CANCELLED')throw new E('الحجز ملغي ولا يمكن تعديله');const kind=g('kind'),a=amt(g('amount'),'المبلغ'),t=totals(b),max=kind==='HALL'?t.hallRem:t.coRem;if(kind==='COORD'&&!b.coord)throw new E('لا يوجد عقد تنسيق');if(H(a)>H(max))throw new E('المبلغ أكبر من المتبقي ('+money(max)+')');pay(b,kind,g('method'),a,g('date'))}
 return true}
function doNew(fd){need('booking:create');const g=k=>(fd.get(k)||'').toString().trim(),date=g('date'),sec=g('section');
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date))throw new E('التاريخ غير صالح');if(!/^\+?\d{9,15}$/.test(g('phone').replace(/[\s-]/g,'')))throw new E('رقم الجوال غير صالح');
 const rental=amt(g('rental'),'مبلغ عقد الإيجار'),coord=g('coord')?amt(g('coord'),'مبلغ التنسيق'):'';
 const cl_=S.bookings.find(x=>x.hallId===+g('hall')&&x.date===date&&x.status!=='CANCELLED'&&conflict(x.section,sec));if(cl_)throw new E('القاعة محجوزة في هذا التاريخ (عقد '+cl_.no+')');
 if(g('no')&&S.bookings.some(x=>x.no===g('no')))throw new E('رقم العقد مستخدم من قبل');if(coord&&sec==='MEN_ONLY')throw new E('الحجز للرجال فقط ولا يقبل عقد تنسيق');
 const b=mk({name:g('name'),phone:g('phone').replace(/[\s-]/g,''),date,section:sec,rental,coord,no:g('no')||undefined});b.hallId=+g('hall');return b}

document.addEventListener('click',e=>{const t=e.target.closest('[data-v],[data-mode],[data-nav],[data-new],[data-open],[data-del],[data-st],[data-void],[data-rc],[data-print],[data-close]');if(!t)return;const d=t.dataset;
 try{
 if(d.close!==undefined){if(e.target===t||t.tagName==='BUTTON')$('#layer').innerHTML='';return}
 if(d.v==='theme'){const r=document.documentElement,dk=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=dk?'light':'dark';return}
 if(d.v==='reset'||d.v==='blank'){seed(d.v==='blank');ui.view='calendar';return render()}
 if(d.v){ui.view=d.v;return render()}
 if(d.mode){ui.mode=d.mode;if(d.mode==='week')ui.d=todayS().slice(0,7)===ui.m?todayS():ui.m+'-01';else ui.m=ui.d.slice(0,7);return render()}
 if(d.nav!==undefined){const n=+d.nav;if(ui.mode==='month'){const x=D(ui.m+'-01');ui.m=n===0?todayS().slice(0,7):iso(new Date(Date.UTC(x.getUTCFullYear(),x.getUTCMonth()+n,1))).slice(0,7)}else ui.d=n===0?todayS():add(ui.d,7*n);return render()}
 if(d.new!==undefined){ui.nd=d.new;ui.view='new';return render()}
 if(d.open){ui.bid=+d.open;ui.view='card';return render()}

 if(d.del){const a=d.del,i=+d.i;if(a==='base'){need('baseExpense:edit');editable(b);b.base.splice(i,1)}if(a==='extras'){need('extra:edit');editable(b);b.extras.splice(i,1);if(H(totals(b).hallRem)<0){throw new E('لا يمكن الحذف: المدفوع سيتجاوز المستحق')}}if(a==='cexp'){need('coordination:edit');editable(b);b.coord.exp.splice(i,1)}return render()}
 if(d.void!==undefined){need('payment:void');b.payments[+d.void].status='VOID';return render()}
 if(d.st){const tg=d.st;need(tg==='CANCELLED'?'booking:cancel':'booking:update');editable(b);const t=totals(b);
  if(tg==='CONFIRMED'&&b.status!=='TENTATIVE')throw new E('الحجز مؤكد مسبقاً');
  if(tg==='COMPLETED'){if(b.status!=='CONFIRMED')throw new E('يجب تأكيد الحجز قبل إنهائه');if(t.rem>0)throw new E('لا يمكن إنهاء الحجز قبل سداد المتبقي ('+money(t.rem)+')')}
  b.status=tg;return render()}
 }catch(err){if(err instanceof E)toast(err.message,1);else{console.error(err);toast('حدث خطأ غير متوقع',1)}}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,fd=new FormData(f);
 try{
 if(f.id==='ff'){ui.hall=$('#f-h').value;ui.status=$('#f-s').value;if($('#f-q'))ui.q=$('#f-q').value.trim();return render()}

 if(f.id==='fn'){const b=doNew(fd);ui.bid=b.id;ui.view='card';toast('تم إنشاء الحجز '+b.no);return render()}
 if(f.dataset.f){doForm(f.dataset.f,fd);toast('تمت العملية');render()}
 }catch(err){if(err instanceof E)toast(err.message,1);else{console.error(err);toast('حدث خطأ غير متوقع',1)}}});
