@media(max-width:1150px){.g3{grid-template-columns:1fr}}@media(max-width:820px){.app{grid-template-columns:1fr}.rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.brand{border:0;padding:0;margin:0 6px 0 0}.rail .sp{display:none}.g2{grid-template-columns:1fr}}

.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}.tabs button{all:unset;cursor:pointer;min-width:38px;text-align:center;padding:5px 11px;border-radius:7px 7px 0 0;background:var(--soft);font:700 13px var(--f);color:var(--muted);white-space:nowrap}
.tabs button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 -2px 0 var(--gold) inset,0 0 0 1px var(--line)}.tabs .fin{background:var(--bad);color:#fff}.tabs .nw{background:var(--btn);color:var(--btnfg)}.tabs .cx{opacity:.5;text-decoration:line-through}
.xh{display:flex;flex-wrap:wrap;gap:4px 22px;background:var(--soft);border:1px solid var(--line);border-radius:10px 10px 0 0;padding:9px 14px;font-weight:600}

.hall .sum{border:0}.hall .sum div{margin:0 0 -1px -1px}.bigyl b{font-size:24px!important}
.two{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px}@media(max-width:1000px){.two{grid-template-columns:1fr}.hall{grid-template-columns:1fr}}
.al{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 0;border-bottom:1px dashed var(--line)}.feed{list-style:none;margin:0;padding:0}.feed li{padding:5px 0;border-bottom:1px dashed var(--line)}.feed time{display:block;color:var(--muted);font-size:12px}
.hint{color:var(--muted);font-size:12.5px}.tag.l{color:var(--navy);border:1px solid var(--navy)}.tag.z{color:#9a3b6b;border:1px solid #9a3b6b}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .tag.l{color:#bfbb45;border-color:#bfbb45}}:root[data-theme=dark] .tag.l{color:#bfbb45;border-color:#bfbb45}
.mx td{padding:3px 8px}.ok2{color:var(--good);font-weight:700}

<div class="app"><nav class="rail" id="rail" aria-label="القائمة الرئيسية"></nav><main id="main"></main></div><div id="layer"></div>
<script>
document.documentElement.lang='ar';document.documentElement.dir='rtl';
const $=s=>document.querySelector(s);
/* ===== الصلاحيات (مطابقة لـ web/src/lib/rbac.ts مع صلاحيات المصروفات والإقفال) ===== */
const ALL=['booking:view','booking:create','booking:update','booking:cancel','baseExpense:edit','extra:edit','coordination:edit','payment:create','payment:void','expense:edit','report:view','audit:view','period:lock','user:manage'];
const ROLES={MANAGER:['مدير القاعة',ALL],ACCOUNTANT:['محاسب',ALL.filter(p=>!['period:lock','user:manage'].includes(p))],RECEPTION:['موظف استقبال',['booking:view','booking:create','booking:update','payment:create']],COORDINATOR:['مشرفة التنسيق',['booking:view','coordination:edit']]};
let role='MANAGER';const can=p=>ROLES[role][1].includes(p);
/* ===== المبالغ بالهللات (مطابقة لـ money.ts / finance.ts) ===== */
const H=v=>Math.round(Number(v)*100),R=h=>h/100,sum=a=>R(a.reduce((s,v)=>s+H(v),0)),sub=(a,b)=>R(H(a)-H(b));
const nf=new Intl.NumberFormat('ar-SA-u-nu-latn',{maximumFractionDigits:2}),money=v=>nf.format(Number(v))+' ر.س';
/* ===== التواريخ ===== */
const D=s=>new Date(s+'T12:00:00Z'),iso=d=>d.toISOString().slice(0,10),add=(s,n)=>iso(new Date(D(s).getTime()+n*864e5)),todayS=()=>new Date().toISOString().slice(0,10);
const fmt=(l,o)=>new Intl.DateTimeFormat(l,{...o,timeZone:'UTC'});
const hij=s=>fmt('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'}).format(D(s)),greg=s=>fmt('ar-SA-u-ca-gregory-nu-latn',{day:'numeric',month:'long',year:'numeric'}).format(D(s));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SEC={BOTH:'قسمين',MEN_ONLY:'رجال فقط',WOMEN_ONLY:'نساء فقط'},ST={TENTATIVE:['مبدئي','wr'],CONFIRMED:['مؤكد','ok'],COMPLETED:['منتهي',''],CANCELLED:['ملغي','bd']},PM={CASH:'كاش',CARD:'شبكة',BANK_TRANSFER:'تحويل بنكي'};
const ENT={L:{n:'قصر ليالي الديار',k:'l',c:'#110f43',m:'ل',sub:'قسم الرجال · إيجار القاعة'},Z:{n:'شركة زوايا المعالي',k:'z',c:'#9a3b6b',m:'ز',sub:'قسم النساء · التنسيق والضيافة'}};
const KIND_E={HALL:'L',COORD:'Z'};
const ACC={1010:'الصندوق',1020:'الشبكة / البنك',1100:'ذمم العملاء',4100:'إيرادات القاعة',4200:'إيرادات التنسيق',5100:'رواتب وأجور',5200:'كهرباء وماء',5300:'مصاريف الحفلات والضيافة',5400:'صيانة'};
const conflict=(a,b)=>a==='BOTH'||b==='BOTH'||a===b;
/* ===== البيانات ===== */
let S;const KEY='hall-erp-full-v1';
const empty=()=>({halls:[{id:1,name:'قاعة ليالي الديار'}],clients:[],bookings:[],gen:[],seq:{c:0,k:0,hall:0,co:0},audit:[],lock:''});
const nextNo=(k,p)=>{S.seq[k]++;return p+'-'+String(S.seq[k]).padStart(4,'0')};
const uid=()=>Date.now()+Math.floor(Math.random()*1e6);
function logA(a){S.audit.unshift({t:new Date().toISOString(),u:ROLES[role][0],a})}
function mk(o){let c=S.clients.find(x=>x.phone===o.phone);if(!c){c={id:S.clients.length+1,name:o.name,phone:o.phone,nid:o.nid||''};S.clients.push(c);logA('إنشاء ملف عميل تلقائي: '+o.name)}
 const b={id:S.bookings.length+1,no:o.no||nextNo('c','ع'),clientId:c.id,hallId:o.hallId||1,date:o.date,section:o.section,rental:o.rental,status:'TENTATIVE',notes:'',created:todayS(),base:[],extras:[],coord:o.coord?{no:o.coordNo||nextNo('k','ف'),amount:o.coord,exp:[]}:null,payments:[]};S.bookings.push(b);logA('إنشاء حجز '+b.no+' للعميل '+c.name);return b}
function pay(b,kind,method,amount,date){const no=kind==='HALL'?nextNo('hall','ل'):nextNo('co','ز');b.payments.push({id:uid(),no,kind,method,amount:String(amount),date:date||todayS(),status:'ACTIVE',created:todayS()});logA('سند قبض '+no+' بمبلغ '+money(amount)+' — '+ENT[KIND_E[kind]].n)}
function demoFill(b){const t=todayS();[750,1080,1200,200,1800].forEach((a,i)=>b.base.push({id:uid(),name:'بند '+(i+1),amount:String(a),d:t}));[[600,370],[240,160],[900,650]].forEach((x,i)=>b.extras.push({id:uid(),name:'خدمة '+(i+1),charged:String(x[0]),cost:String(x[1]),d:t}));if(b.coord)[100,600,250].forEach((a,i)=>b.coord.exp.push({id:uid(),name:'بند '+(i+1),amount:String(a),d:t}))}
function seed(mode){S=empty();if(mode==='blank')return;
 const a=mk({name:'محمد العتيبي',phone:'0551234567',nid:'1090011223',date:add(todayS(),6),section:'BOTH',rental:'17000',coord:'12200'});a.status='CONFIRMED';pay(a,'HALL','BANK_TRANSFER',5100);pay(a,'COORD','CARD',3660);
 const b=mk({name:'فهد الدوسري',phone:'0533344556',nid:'1070055443',date:add(todayS(),20),section:'MEN_ONLY',rental:'12000'});b.status='CONFIRMED';pay(b,'HALL','CASH',3600);
 const c=mk({name:'عمر الشمري',phone:'0544455667',nid:'1055566778',date:add(todayS(),45),section:'BOTH',rental:'20000',coord:'9000'});
 if(mode==='demo'){S.bookings.forEach(demoFill);S.gen.push({id:uid(),t:'بند عام ١',amount:'1850',acc:'5200',method:'CASH',entity:'',date:todayS()},{id:uid(),t:'بند عام ٢',amount:'2600',acc:'5100',method:'BANK_TRANSFER',entity:'',date:todayS()})}}
function load(){try{const j=localStorage.getItem(KEY);if(j){S=JSON.parse(j);return}}catch(e){}seed('demo')}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const cl=b=>S.clients.find(c=>c.id===b.clientId),hallN=b=>S.halls.find(h=>h.id===b.hallId).name,bk=id=>S.bookings.find(b=>b.id===id);
/* ===== الحسابات ===== */
function totals(b){const act=b.payments.filter(p=>p.status==='ACTIVE'),rental=+b.rental,base=sum(b.base.map(x=>x.amount)),exC=sum(b.extras.map(x=>x.charged)),exK=sum(b.extras.map(x=>x.cost)),cA=b.coord?+b.coord.amount:0,cE=b.coord?sum(b.coord.exp.map(x=>x.amount)):0;
 const paid=sum(act.map(p=>p.amount)),hallPaid=sum(act.filter(p=>p.kind==='HALL').map(p=>p.amount)),coPaid=sum(act.filter(p=>p.kind==='COORD').map(p=>p.amount)),rev=sum([rental,exC,cA]),exp=sum([base,exK,cE]),hallDue=sum([rental,exC]);
 return{rental,base,rentalNet:sub(rental,base),exC,exK,exNet:sub(exC,exK),cA,cE,cNet:sub(cA,cE),rev,exp,net:sub(rev,exp),paid,rem:b.status==='CANCELLED'?0:sub(rev,paid),hallRem:sub(hallDue,hallPaid),coRem:sub(cA,coPaid),coPaid,hallPaid}}
const live=b=>b.status!=='CANCELLED';
/* القيود المحاسبية تُولَّد من المستندات نفسها، فلا تختلف عنها أبداً */
function journal(){const J=[],mt=m=>m==='CASH'?'1010':'1020';
 S.bookings.forEach(b=>{const t=totals(b),e0=b.created;
  const rev=(d,ref,desc,L,Z,sign)=>{if(L)J.push({d,ref,desc,e:'L',lines:sign>0?[['1100',L,0],['4100',0,L]]:[['4100',L,0],['1100',0,L]]});if(Z)J.push({d,ref,desc,e:'Z',lines:sign>0?[['1100',Z,0],['4200',0,Z]]:[['4200',Z,0],['1100',0,Z]]})};
  rev(e0,b.no,'عقد '+b.no,+b.rental,b.coord?+b.coord.amount:0,1);
  b.extras.forEach(x=>rev(x.d,b.no,'زيادة: '+x.name,+x.charged,0,1));
  b.base.forEach(x=>J.push({d:x.d,ref:b.no,desc:'مصروف عقد: '+x.name,e:'L',lines:[['5300',+x.amount,0],['1010',0,+x.amount]]}));
  b.extras.filter(x=>+x.cost>0).forEach(x=>J.push({d:x.d,ref:b.no,desc:'صرف زيادة: '+x.name,e:'L',lines:[['5300',+x.cost,0],['1010',0,+x.cost]]}));
  if(b.coord)b.coord.exp.forEach(x=>J.push({d:x.d,ref:b.no,desc:'مصروف تنسيق: '+x.name,e:'Z',lines:[['5300',+x.amount,0],['1010',0,+x.amount]]}));
  b.payments.forEach(p=>{const e=KIND_E[p.kind],a=+p.amount;J.push({d:p.date,ref:p.no,desc:'سند قبض '+p.no,e,lines:[[mt(p.method),a,0],['1100',0,a]]});if(p.status==='VOID')J.push({d:p.vd||p.date,ref:p.no,desc:'عكس سند '+p.no,e,lines:[['1100',a,0],[mt(p.method),0,a]]})});
  if(b.status==='CANCELLED')rev(b.cancelAt||e0,b.no,'عكس قيد إلغاء '+b.no,+b.rental+sum(b.extras.map(x=>x.charged)),b.coord?+b.coord.amount:0,-1)});
 S.gen.forEach(g=>{const r='م-'+g.id%10000;J.push({d:g.date,ref:r,desc:g.t,e:g.entity,lines:[[g.acc,+g.amount,0],[mt(g.method),0,+g.amount]]});if(g.status==='VOID')J.push({d:g.vd||g.date,ref:r,desc:'عكس '+g.t,e:g.entity,lines:[[mt(g.method),+g.amount,0],[g.acc,0,+g.amount]]})});
 return J.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0)}
function bal(){const t={};journal().forEach(j=>j.lines.forEach(l=>{t[l[0]]=t[l[0]]||[0,0];t[l[0]][0]=sum([t[l[0]][0],l[1]]);t[l[0]][1]=sum([t[l[0]][1],l[2]])}));return t}
/* تجميع لوحة التحكم: نفس تسميات ورقة الملخص في Excel */
function agg(f){const iL=f.ent!=='Z',iZ=f.ent!=='L',o={rent:0,exC:0,coord:0,base:0,exK:0,cExp:0,netMen:0,netCoord:0,gen:0,paid:0,rem:0,n:0,rev:0,exps:0};

 if(f==='coamt'){need('coordination:edit');editable(b);if(b.section==='MEN_ONLY')throw new E('الحجز للرجال فقط ولا يقبل عقد تنسيق');const a=amt(g('amount'),'مبلغ التنسيق');if(b.coord){if(H(a)<H(totals(b).coPaid))throw new E('المبلغ أقل من المدفوع على التنسيق');b.coord.amount=a}else b.coord={no:nextNo('k','ف'),amount:a,exp:[]};logA('عقد تنسيق '+b.coord.no+' بمبلغ '+money(a))}
 if(f==='notes'){need('booking:update');editable(b);b.notes=g('notes').slice(0,4000);logA('تحديث ملاحظات '+b.no)}
 if(f==='pay'){need('payment:create');if(b.status==='CANCELLED')throw new E('الحجز ملغي ولا يمكن تعديله');const kind=g('kind'),a=amt(g('amount'),'المبلغ'),tt=totals(b),max=kind==='HALL'?tt.hallRem:tt.coRem;if(kind==='COORD'&&!b.coord)throw new E('لا يوجد عقد تنسيق');if(H(a)>H(max))throw new E('المبلغ أكبر من المتبقي ('+money(max)+')');pay(b,kind,g('method'),a,g('date'))}
 if(f==='hall'){need('user:manage');if(S.halls.some(h=>h.name===g('name')))throw new E('القاعة موجودة');S.halls.push({id:S.halls.length+1,name:g('name')});logA('إضافة قاعة '+g('name'))}}
function doNew(fd){need('booking:create');guard();const g=k=>(fd.get(k)||'').toString().trim(),date=g('date'),sec=g('section');
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date))throw new E('التاريخ غير صالح');const ph=g('phone').replace(/[\s-]/g,'');if(!/^\+?\d{9,15}$/.test(ph))throw new E('رقم الجوال غير صالح');
 const rental=amt(g('rental'),'مبلغ عقد الإيجار'),coord=g('coord')?amt(g('coord'),'مبلغ التنسيق'):'',dep=g('dep')?amt(g('dep'),'العربون'):'';
 const x=S.bookings.find(x=>x.hallId===+g('hall')&&x.date===date&&x.status!=='CANCELLED'&&conflict(x.section,sec));if(x)throw new E('القاعة محجوزة في هذا التاريخ (عقد '+x.no+')');
 if(g('no')&&S.bookings.some(x=>x.no===g('no')))throw new E('رقم العقد مستخدم من قبل');if(coord&&sec==='MEN_ONLY')throw new E('الحجز للرجال فقط ولا يقبل عقد تنسيق');if(dep&&H(dep)>H(rental))throw new E('العربون أكبر من مبلغ العقد');
 const b=mk({name:g('name'),phone:ph,nid:g('nid'),date,section:sec,rental,coord,no:g('no')||undefined,coordNo:g('coordNo')||undefined,hallId:+g('hall')});if(dep)pay(b,'HALL',g('method'),dep);return b}
/* ===== الأحداث ===== */
const VIEWS={dash:V_dash,events:V_events,calendar:V_calendar,rec:V_rec,exp:V_exp,cust:V_cust,daily:V_daily,reports:V_reports,ledger:V_ledger,audit:V_audit,set:V_set};
function render(){const n=NAV.find(x=>x[0]===ui.view);if(!n||!can(n[2]))ui.view=can('report:view')?'dash':'events';nav();$('#main').innerHTML=VIEWS[ui.view]();save()}
const run=fn=>{try{fn()}catch(err){if(err instanceof E)toast(err.message,1);else{console.error(err);toast('حدث خطأ غير متوقع',1)}}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-v],[data-ent],[data-mode],[data-nav],[data-new],[data-open],[data-del],[data-st],[data-void],[data-rc],[data-print],[data-svc],[data-stmt],[data-gv],[data-close]');if(!t)return;const d=t.dataset;run(()=>{
 if(d.close!==undefined){if(e.target===t||t.tagName==='BUTTON')$('#layer').innerHTML='';return}
 if(d.v==='theme'){const r=document.documentElement,dk=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=dk?'light':'dark';return}
 if(['demo','seed','blank'].includes(d.v)){seed(d.v);ui.cur=1;return render()}
 if(d.v){ui.view=d.v;return render()}
 if(d.ent){ui.flt=d.ent;return render()}
 if(d.mode){ui.mode=d.mode;if(d.mode==='week')ui.d=todayS().slice(0,7)===ui.m?todayS():ui.m+'-01';else ui.m=ui.d.slice(0,7);return render()}
 if(d.nav!==undefined){const n=+d.nav;if(ui.mode==='month'){const x=D(ui.m+'-01');ui.m=n===0?todayS().slice(0,7):iso(new Date(Date.UTC(x.getUTCFullYear(),x.getUTCMonth()+n,1))).slice(0,7)}else ui.d=n===0?todayS():add(ui.d,7*n);return render()}
 if(d.new!==undefined){ui.nd=d.new;ui.cur='new';ui.view='events';return render()}
 if(d.open){ui.cur=+d.open;ui.view='events';return render()}
 if(d.print)return printB(+d.print);if(d.svc)return svcB(+d.svc);if(d.stmt)return stmt(+d.stmt);
 if(d.rc){if(d.rcb)ui.cur=+d.rcb;return recB(d.rc)}
 const b=bk(ui.cur);
 if(d.del){guard();const a=d.del,id=+d.id;if(a==='base'){need('baseExpense:edit');editable(b);b.base=b.base.filter(x=>x.id!==id)}if(a==='extras'){need('extra:edit');editable(b);const keep=b.extras;b.extras=b.extras.filter(x=>x.id!==id);if(H(totals(b).hallRem)<0){b.extras=keep;throw new E('لا يمكن الحذف: المدفوع سيتجاوز المستحق')}}if(a==='cexp'){need('coordination:edit');editable(b);b.coord.exp=b.coord.exp.filter(x=>x.id!==id)}logA('حذف بند من '+b.no);return render()}
 if(d.void){need('payment:void');guard();const bb=S.bookings.find(x=>x.payments.some(p=>p.id==d.void)),p=bb.payments.find(x=>x.id==d.void);p.status='VOID';p.vd=todayS();logA('إلغاء سند '+p.no+' بقيد عكسي');return render()}
 if(d.gv){need('expense:edit');guard();const g=S.gen.find(x=>x.id==d.gv);g.status='VOID';g.vd=todayS();logA('إلغاء مصروف عام «'+g.t+'»');return render()}
 if(d.st){const tg=d.st;need(tg==='CANCELLED'?'booking:cancel':'booking:update');guard();editable(b);const tt=totals(b);
  if(tg==='CONFIRMED'&&b.status!=='TENTATIVE')throw new E('الحجز مؤكد مسبقاً');
  if(tg==='COMPLETED'){if(b.status!=='CONFIRMED')throw new E('يجب تأكيد الحجز قبل إنهائه');if(tt.rem>0)throw new E('لا يمكن إنهاء الحجز قبل سداد المتبقي ('+money(tt.rem)+')')}
  b.status=tg;if(tg==='CANCELLED')b.cancelAt=todayS();logA('تغيير حالة '+b.no+' إلى '+ST[tg][0]);return render()}})});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,fd=new FormData(f);run(()=>{
 if(f.id==='ff'){ui.hall=$('#f-h').value;ui.status=$('#f-s').value;ui.q=$('#f-q').value.trim();return render()}
 if(f.id==='fd'){ui.dh=$('#d-h').value;ui.df=$('#d-f').value||ui.df;ui.dt=$('#d-t').value||ui.dt;return render()}
 if(f.id==='fl'){need('period:lock');S.lock=$('#l-d').value;logA('تحديد تاريخ الإقفال: '+(S.lock||'مفتوحة'));toast(S.lock?'تم إقفال الفترة':'تم فتح الفترة');return render()}
 if(f.id==='fe'){need('expense:edit');guard();const g=k=>fd.get(k).toString().trim();S.gen.push({id:uid(),t:g('t'),amount:amt(g('amount'),'المبلغ'),acc:g('acc'),method:g('method'),entity:g('entity'),date:todayS()});logA('تسجيل مصروف عام «'+g('t')+'»');toast('تم تسجيل المصروف');return render()}
 if(f.id==='fn'){const b=doNew(fd);ui.cur=b.id;toast('تم إنشاء الحفل '+b.no);return render()}
 if(f.dataset.f){doForm(f.dataset.f,fd);toast('تمت العملية');render()}})});
document.addEventListener('change',e=>{if(e.target.id==='role'){role=e.target.value;render()}});
load();if(!can('report:view'))ui.view='events';render();
