<title>نظام ليالي الديار وزوايا المعالي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500&display=swap">
<style>
/* Layout: right-hand navy rail + fluid workspace; gold marks the active entity; navy/gold from theme.json */
:root{--bg:#f4f3ee;--surface:#fff;--ink:#17163a;--muted:#6a6a7c;--line:#e3e1d6;--navy:#110f43;--gold:#bfbb45;--gold-ink:#6b6820;--layali:#110f43;--zawaya:#9a3b6b;--good:#1c7c4d;--bad:#b3261e;--warn:#9a6a00;--soft:#eceae0;--btn:#110f43;--btnfg:#fff;--f-d:'Cairo',system-ui,sans-serif;--f-b:'Tajawal','Cairo',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0c26;--surface:#17163a;--ink:#eeedf7;--muted:#a3a2bd;--line:#2c2b55;--navy:#07061a;--gold-ink:#d7d36a;--layali:#bfbb45;--zawaya:#e58bb8;--good:#58c98c;--bad:#ff8a80;--warn:#e8b64a;--soft:#211f4a;--btn:#bfbb45;--btnfg:#110f43;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0c26;--surface:#17163a;--ink:#eeedf7;--muted:#a3a2bd;--line:#2c2b55;--navy:#07061a;--gold-ink:#d7d36a;--layali:#bfbb45;--zawaya:#e58bb8;--good:#58c98c;--bad:#ff8a80;--warn:#e8b64a;--soft:#211f4a;--btn:#bfbb45;--btnfg:#110f43;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.6}
h1,h2,h3,button,th,.num,label{font-family:var(--f-d)}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.rail{background:var(--navy);color:#e9e8f5;padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px 16px;border-bottom:1px solid #ffffff22;margin-bottom:10px}
.mono{width:40px;height:40px;border-radius:10px;background:var(--gold);color:#110f43;display:grid;place-items:center;font:800 20px var(--f-d);flex:none}
.brand b{font:700 15px/1.3 var(--f-d);display:block}.brand small{color:#b9b8d6;font-size:12px}
.rail button{all:unset;cursor:pointer;display:flex;gap:10px;padding:9px 12px;border-radius:9px;font:600 14px var(--f-d);color:#cfcee8}
.rail button:hover{background:#ffffff14}.rail button[aria-current=page]{background:var(--gold);color:#110f43}
.rail button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.rail .sp{flex:1}
main{padding:22px clamp(16px,3vw,32px);min-width:0}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.top h1{margin:0;font-size:24px}.top .date{color:var(--muted);font-size:13px}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:6px 14px;border-radius:8px;font:600 13px var(--f-d);color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px #0002}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.kpi span{color:var(--muted);font-size:13px}.kpi .num{font-size:24px;font-weight:800;display:block;font-variant-numeric:tabular-nums}
.kpi.net{background:var(--navy);color:#fff;border-color:var(--navy)}.kpi.net span{color:#b9b8d6}.kpi.net .num{color:var(--gold)}
.two{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h2{margin:0 0 12px;font-size:17px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:right;color:var(--muted);font-weight:600;font-size:12.5px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td.n{text-align:left;white-space:nowrap}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font:600 12px var(--f-d);background:var(--soft)}
.tag.l{color:var(--layali);border:1px solid var(--layali)}.tag.z{color:var(--zawaya);border:1px solid var(--zawaya)}
.tag.ok{background:#1c7c4d22;color:var(--good)}.tag.wr{background:#9a6a0022;color:var(--warn)}.tag.bd{background:#b3261e22;color:var(--bad)}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.feed li{display:flex;gap:10px;font-size:14px;border-bottom:1px dashed var(--line);padding-bottom:8px}
.feed time{color:var(--muted);font-size:12px;display:block}
.btn{all:unset;cursor:pointer;background:var(--btn);color:var(--btnfg);padding:8px 16px;border-radius:9px;font:700 14px var(--f-d)}
.btn.alt{background:var(--soft);color:var(--ink)!important}.btn.sm{padding:3px 10px;font-size:12.5px}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end;margin-bottom:6px}
.f label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.bar{height:8px;background:var(--soft);border-radius:9px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--gold)}
.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:start center;overflow:auto;padding:20px 16px;z-index:9}
.sheet{background:#fff;color:#111;width:min(680px,100%);padding:30px;border-radius:6px;border-top:8px solid var(--c,#110f43);font-family:var(--f-d)}
.sheet h3{margin:0;font-size:22px}.sheet .hd{display:flex;gap:12px;justify-content:space-between;align-items:center;border-bottom:2px solid #ddd;padding-bottom:12px;margin-bottom:14px;flex-wrap:wrap}
.sheet .mono{background:var(--c);color:#fff}.sheet table{font-size:14px}.sheet th{color:#555}.sheet td,.sheet th{border-color:#ddd}
.sheet .sg{display:flex;justify-content:space-between;margin-top:36px;gap:16px;font-size:13px}
.empty{color:var(--muted);padding:18px;text-align:center}
.toast{position:fixed;bottom:16px;inset-inline:16px;margin:auto;width:max-content;max-width:calc(100% - 32px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;z-index:20;font:600 14px var(--f-d)}
.note{background:var(--soft);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--muted);margin-bottom:14px}
@media(max-width:860px){.app{grid-template-columns:1fr}.rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:10px}.brand{border:0;padding:0;margin:0 8px 0 0}.rail .sp,.brand small{display:none}.two{grid-template-columns:1fr}}
.rail select{background:#ffffff14;color:#fff;border-color:#ffffff33;margin-top:4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.cal .dn{font:600 12px var(--f-d);color:var(--muted);text-align:center}
.cal .d{border:1px solid var(--line);border-radius:9px;min-height:78px;padding:5px;min-width:0;overflow:hidden}.cal .d.off{opacity:.35}.cal .d.hall{background:var(--soft)}.cal .d.td{outline:2px solid var(--gold)}
.chip{display:block;font:700 11px var(--f-d);padding:1px 5px;border-radius:5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}.chip.l{background:#110f43}.chip.z{background:#9a3b6b}.chip.rq{opacity:.55;outline:1px dashed #fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .chip.l{background:#bfbb45;color:#110f43}}:root[data-theme=dark] .chip.l{background:#bfbb45;color:#110f43}
.al{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.ok2{color:var(--good)}@media(max-width:560px){.cal .d{min-height:58px;padding:3px}.chip{font-size:10px}}
</style>
<div class="app">
<nav class="rail" id="rail" aria-label="القائمة الرئيسية"></nav>
<main id="main"></main>
</div>
<div id="layer"></div>
<script>
document.documentElement.lang='ar';document.documentElement.dir='rtl';
const $=s=>document.querySelector(s);
const ENT={L:{n:'قصر ليالي الديار',k:'l',c:'#110f43',m:'ل',sec:'قسم الرجال · إيجار القاعة',cr:'4100'},Z:{n:'شركة زوايا المعالي',k:'z',c:'#9a3b6b',m:'ز',sec:'قسم النساء · التنسيق والضيافة',cr:'4200'}};
const ACC={1010:'الصندوق',1020:'الشبكة / البنك',1100:'ذمم العملاء',4100:'إيرادات القاعة',4200:'إيرادات التنسيق',5100:'رواتب وأجور',5200:'كهرباء وماء',5300:'ضيافة ومشتريات',5400:'صيانة'};
const PAY={cash:'نقد',card:'شبكة',bank:'تحويل بنكي'};
const STAT={req:['حجز مبدئي','wr'],conf:['مؤكد','ok'],done:['مكتمل',''],cancel:['ملغي','bd']};
const ROLES={mgr:{n:'نورة الشهري',t:'مدير القاعة',deny:[],hide:[]},acc:{n:'ياسر الحربي',t:'محاسب',deny:['cancel','lock'],hide:[]},rec:{n:'هند السبيعي',t:'موظفة استقبال',deny:['cancel','lock','exp'],hide:['ledger','audit','reports','daily']}};
let role='mgr',view='dash',flt='ALL',cm=0;
const can=a=>!ROLES[role].deny.includes(a),USER=()=>ROLES[role].n+' ('+ROLES[role].t+')';
const nf=new Intl.NumberFormat('ar-SA-u-nu-latn'),money=n=>nf.format(Math.round(n))+' ر.س';
const shift=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const today=()=>new Date().toISOString().slice(0,10),addDays=n=>shift(today(),n);
const hij=d=>{try{return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'}).format(new Date(d+'T12:00:00'))}catch(e){return ''}};
const greg=d=>new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn',{day:'numeric',month:'long',year:'numeric'}).format(new Date(d+'T12:00:00'));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S;const KEY='layali-trial-v2';
/* ---- الدفتر: قيد مزدوج + سلسلة تجزئة (مستوحى من Odoo inalterable_hash و ERPNext GL Entry) ---- */
function fnv(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h.toString(16).padStart(8,'0')}
const hp=j=>fnv(j.prev+'|'+j.date+'|'+j.ref+'|'+JSON.stringify(j.lines));
function post(ref,desc,lines,e){const dr=lines.reduce((x,l)=>x+l[1],0),cr=lines.reduce((x,l)=>x+l[2],0);if(dr!==cr)throw new Error('قيد غير متوازن');
 const j={id:S.jr.length+1,date:today(),ref,desc,e:e||'',lines,prev:S.jr.length?S.jr[S.jr.length-1].h:'0'};j.h=hp(j);S.jr.push(j)}
const chain=()=>{let p='0';for(const j of S.jr){if(j.prev!==p||j.h!==hp(j))return j.id;p=j.h}return 0};
function log(a){S.log.unshift({t:new Date().toISOString(),u:USER(),a})}
function guard(){if(S.lock&&today()<=S.lock){toast('الفترة مقفلة حتى '+greg(S.lock)+'، لا يمكن إضافة قيود');return false}return true}
function cust(name,phone,idn){let c=S.cust.find(x=>x.phone===phone);if(!c){c={id:S.cust.length+1,name,phone,idn};S.cust.push(c);log('إنشاء ملف عميل تلقائي: '+name)}return c}
const paidOf=b=>S.rec.filter(r=>r.bid===b.id&&r.st==='ok').reduce((x,r)=>x+r.amt,0);
const outOf=b=>b.st==='cancel'?0:b.total-paidOf(b);
const cn=id=>S.cust.find(c=>c.id===id)?.name||'';
function sched(total,date){const a=Math.round(total*.3),m=Math.round(total*.4);return [{l:'العربون',due:today(),amt:a},{l:'الدفعة الثانية',due:shift(date,-14),amt:m},{l:'الدفعة الأخيرة',due:shift(date,-3),amt:total-a-m}]}
function dues(b){if(b.st==='cancel'||b.st==='done')return[];const p=paidOf(b);let cum=0,r=[];for(const i of b.inst){cum+=i.amt;if(p<cum)r.push({b,l:i.l,due:i.due,rem:Math.min(i.amt,cum-p),late:i.due<today()})}return r}
function mkBook(e,name,phone,idn,date,kind,a,paid,pm){
 const c=cust(name,phone,idn),items=e==='Z'?a:[],total=e==='Z'?items.reduce((x,i)=>x+i[1],0):a;
 const b={id:S.book.length+1,e,no:(e==='L'?'ع-':'ف-')+String(S.seq[e]++).padStart(4,'0'),cid:c.id,date,kind,total,items,created:today(),st:'req',inst:sched(total,date)};S.book.push(b);
 post(b.no,(e==='L'?'عقد قاعة ':'فاتورة تنسيق ')+b.no,[['1100',total,0,],[ENT[e].cr,0,total]],e);
 log('إصدار '+(e==='L'?'عقد':'فاتورة')+' '+b.no+' — '+ENT[e].n);
 if(paid>0){mkRec(b.id,paid,pm);if(paid>=b.inst[0].amt)b.st='conf'}return b}
function mkRec(bid,amt,pm){const b=S.book.find(x=>x.id===bid);
 const r={id:S.rec.length+1,no:'س-'+String(S.seq.R++).padStart(4,'0'),bid,e:b.e,amt,pm,date:today(),st:'ok'};S.rec.push(r);
 post(r.no,'سند قبض '+r.no,[[pm==='cash'?'1010':'1020',amt,0],['1100',0,amt]],b.e);log('سند قبض '+r.no+' بمبلغ '+money(amt)+' — '+ENT[b.e].n);return r}
function addExp(t,amt,acc,pm,e){S.exp.push({id:S.exp.length+1,t,amt,acc,pm,date:today(),e:e||''});post('م-'+S.exp.length,t,[[acc,amt,0],[pm==='cash'?'1010':'1020',0,amt]],e);log('تسجيل مصروف: '+t+' — '+money(amt))}
function seed(){S={cust:[],book:[],rec:[],exp:[],jr:[],log:[],seq:{L:1,Z:1,R:1},lock:''};
 mkBook('L','محمد العتيبي','0551234567','1090011223',addDays(6),'حفل زواج',18000,5400,'bank');
 mkBook('Z','سارة القحطاني','0509876543','1080099887',addDays(6),'تنسيق زواج',[['كوشة ملكية',6500],['طاولات وتزيين',3200],['ضيافة وحلويات',4300]],4200,'card');
 mkBook('L','فهد الدوسري','0533344556','1070055443',addDays(20),'حفل خطوبة',12000,3600,'cash');
 mkBook('L','عمر الشمري','0544455667','1055566778',addDays(45),'حفل زواج',20000,0,'cash');
 addExp('كهرباء وماء — الشهر الحالي',1850,'5200','cash','');addExp('ضيافة وقهوة للقاعة',920,'5300','cash','L');addExp('مستلزمات كوشة',1400,'5300','bank','Z')}
function load(){try{const j=localStorage.getItem(KEY);if(j){S=JSON.parse(j);return}}catch(e){}seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
/* ---- الواجهة ---- */
const NAV=[['dash','عين المدير'],['book','العقود والفواتير'],['rec','سندات القبض'],['exp','المصروفات'],['cal','تقويم الحجوزات'],['cust','العملاء (تلقائي)'],['daily','الكشف اليومي'],['reports','التقارير والإقفال'],['ledger','القيود المحاسبية'],['audit','سجل العمليات']];
function nav(){$('#rail').innerHTML=`<div class="brand"><div class="mono">ق</div><div><b>ليالي الديار<br>وزوايا المعالي</b><small>نظام ERP · نسخة 2</small></div></div>`+NAV.filter(([k])=>!ROLES[role].hide.includes(k)).map(([k,t])=>`<button data-v="${k}" ${k===view?'aria-current="page"':''}>${t}</button>`).join('')+`<div class="sp"></div><label style="font-size:12px;color:#b9b8d6">المستخدم الحالي<select id="role">${Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${k===role?'selected':''}>${r.n} · ${r.t}</option>`).join('')}</select></label><button data-v="theme">تبديل الوضع الداكن</button><button data-v="reset">إعادة البيانات التجريبية</button>`}
const inF=x=>flt==='ALL'||x.e===flt;
const seg=()=>`<div class="seg" role="group" aria-label="تصفية الكيان">${[['ALL','الرؤية المجمعة'],['L','ليالي الديار'],['Z','زوايا المعالي']].map(([k,t])=>`<button data-f="${k}" aria-pressed="${flt===k}">${t}</button>`).join('')}</div>`;
const head=t=>`<div class="top"><div><h1>${t}</h1><div class="date">${hij(today())} · ${greg(today())} م</div></div>${seg()}</div>`;
const tag=e=>`<span class="tag ${ENT[e].k}">${ENT[e].n}</span>`,st=b=>`<span class="tag ${STAT[b.st][1]}">${STAT[b.st][0]}</span>`;
const live=()=>S.book.filter(b=>b.st!=='cancel'&&inF(b));
function V_dash(){
 const bs=live(),rv=bs.reduce((x,b)=>x+b.total,0),ex=S.exp.filter(e=>flt==='ALL'||e.e===flt).reduce((x,e)=>x+e.amt,0);
 const col=S.rec.filter(r=>r.st==='ok'&&inF(r)).reduce((x,r)=>x+r.amt,0),rem=bs.reduce((x,b)=>x+outOf(b),0);
 const all=bs.flatMap(dues),late=all.filter(d=>d.late),lateSum=late.reduce((x,d)=>x+d.rem,0);
 const soon=all.filter(d=>d.due<=addDays(7)).sort((a,b)=>a.due<b.due?-1:1).filter((d,i,a)=>a.findIndex(x=>x.b===d.b)===i);
 const hall=new Set(S.book.filter(b=>b.e==='L'&&b.st!=='cancel'&&b.date>=today()&&b.date<addDays(30)).map(b=>b.date)).size;
 const byE=e=>S.book.filter(b=>b.e===e&&b.st!=='cancel').reduce((x,b)=>x+b.total,0),mx=Math.max(byE('L'),byE('Z'),1);
 return head('عين المدير')+(flt!=='ALL'?`<div class="note">المصروفات العامة غير المنسوبة لكيان تظهر في الرؤية المجمعة فقط.</div>`:'')+`
 <div class="grid kpis"><div class="kpi"><span>إجمالي الإيرادات</span><b class="num">${money(rv)}</b></div><div class="kpi"><span>المتحصل فعلياً</span><b class="num">${money(col)}</b></div>
 <div class="kpi"><span>إجمالي المصروفات</span><b class="num">${money(ex)}</b></div><div class="kpi"><span>المتبقي لدى العملاء</span><b class="num" style="color:var(--warn)">${money(rem)}</b></div>
 <div class="kpi"><span>دفعات متأخرة</span><b class="num" style="color:var(--bad)">${money(lateSum)}</b></div><div class="kpi"><span>إشغال القاعة خلال ٣٠ يوماً</span><b class="num">${hall} / 30</b></div>
 <div class="kpi net"><span>الصافي المالي</span><b class="num">${money(rv-ex)}</b></div></div>
 <div class="grid two"><div class="card"><h2>تنبيهات التحصيل</h2>${soon.map(d=>`<div class="al"><span><b>${esc(cn(d.b.cid))}</b> · ${d.b.no} · ${d.l}</span><span class="num"><span class="tag ${d.late?'bd':'wr'}">${d.late?'متأخرة منذ '+greg(d.due):'تستحق '+greg(d.due)}</span> ${money(d.rem)}</span></div>`).join('')||'<div class="empty">لا توجد دفعات مستحقة خلال أسبوع</div>'}
 <h2 style="margin-top:20px">سجل الحركة المباشر</h2><ul class="feed">${S.log.slice(0,6).map(l=>`<li><div><b>${esc(l.a)}</b><time>${esc(l.u)} · ${new Date(l.t).toLocaleTimeString('ar-SA-u-nu-latn',{hour:'2-digit',minute:'2-digit'})}</time></div></li>`).join('')}</ul></div>
 <div class="card"><h2>الإيراد حسب الكيان</h2>${['L','Z'].map(e=>`<p style="margin:0 0 12px"><span style="display:flex;justify-content:space-between"><b>${ENT[e].n}</b><span class="num">${money(byE(e))}</span></span><span class="bar" style="display:block;margin-top:5px"><i style="width:${byE(e)/mx*100}%;background:${e==='L'?'#110f43':'#9a3b6b'}"></i></span></p>`).join('')}

 sheet(shHd(b.e,b.e==='L'?'عقد إيجار قاعة':'فاتورة خدمات تنسيق',b.no)+`<p>الطرف الثاني: <b>${esc(cn(b.cid))}</b> · جوال ${esc(S.cust.find(c=>c.id===b.cid).phone)}<br>المناسبة: ${b.kind} بتاريخ <b>${greg(b.date)}</b> · الحالة: ${STAT[b.st][0]}</p>`+(b.e==='Z'?`<table><thead><tr><th>الخدمة</th><th>السعر</th></tr></thead><tbody>${b.items.map(i=>`<tr><td>${esc(i[0])}</td><td>${money(i[1])}</td></tr>`).join('')}</tbody></table>`:`<p>يؤجر الطرف الأول القاعة للطرف الثاني في التاريخ المذكور، ويلتزم الطرف الثاني بسداد القيمة وفق جدول الدفعات وبالمحافظة على محتويات القاعة.</p>`)+`<h4>جدول الدفعات</h4>${instT(b)}<p>الإجمالي: <b>${money(b.total)}</b> · المدفوع: ${money(p)} · المتبقي: <b>${money(outOf(b))}</b></p><div class="sg"><span>توقيع الطرف الأول</span><span>توقيع الطرف الثاني</span></div>`,b.e)}
function svcB(id){const b=S.book.find(x=>x.id===id);sheet(shHd('Z','ورقة الخدمات التشغيلية',b.no)+`<p>العميلة: <b>${esc(cn(b.cid))}</b> · المناسبة: ${b.kind} · ${greg(b.date)}</p><table><thead><tr><th>الخدمة المطلوبة</th><th>تم التنفيذ</th></tr></thead><tbody>${b.items.map(i=>`<tr><td>${esc(i[0])}</td><td>☐</td></tr>`).join('')}</tbody></table><p>ملاحظات الفريق الميداني: ____________________</p><div class="sg"><span>المرسل</span><span>مشرفة التنفيذ</span></div>`,'Z')}
function recB(id){const r=S.rec.find(x=>x.id===id),b=S.book.find(x=>x.id===r.bid);sheet(shHd(r.e,'سند قبض',r.no)+`<p>استلمنا من: <b>${esc(cn(b.cid))}</b><br>مبلغ وقدره: <b>${money(r.amt)}</b> · طريقة الدفع: ${PAY[r.pm]}<br>وذلك عن: ${b.e==='L'?'عقد قاعة':'فاتورة تنسيق'} ${b.no}<br>المتبقي بعد السند: ${money(outOf(b))}${r.st==='void'?'<br><b style="color:#b3261e">هذا السند ملغى بقيد عكسي</b>':''}</p><div class="sg"><span>المستلم</span><span>ختم الجهة</span></div>`,r.e)}
function stmt(id){const c=S.cust.find(x=>x.id===id),ev=[];S.book.filter(b=>b.cid===id).forEach(b=>{ev.push([b.created,b.no+' '+(b.e==='L'?'عقد قاعة':'فاتورة تنسيق'),b.total,0]);if(b.st==='cancel')ev.push([b.created,'إلغاء '+b.no+' (قيد عكسي)',0,b.total]);S.rec.filter(r=>r.bid===b.id&&r.st==='ok').forEach(r=>ev.push([r.date,'سند قبض '+r.no,0,r.amt]))});let run=0;
 sheet(shHd(null,'كشف حساب عميل',esc(c.name))+`<table><thead><tr><th>التاريخ</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead><tbody>${ev.map(x=>{run+=x[2]-x[3];return `<tr><td>${greg(x[0])}</td><td>${esc(x[1])}</td><td>${x[2]?money(x[2]):''}</td><td>${x[3]?money(x[3]):''}</td><td>${money(run)}</td></tr>`}).join('')}</tbody></table><p>الرصيد المستحق على العميل: <b>${money(run)}</b>${run<0?' (مبلغ محتجز لصالح العميل)':''}</p>`,null)}
function act(a,id){
 if(a==='stmt')return stmt(id);const b=S.book.find(x=>x.id===id);
 if((a==='cancelb'||a==='voidr')&&!can('cancel'))return toast('الإلغاء من صلاحية مدير القاعة فقط');
 if(!guard())return;
 if(a==='conf'){if(paidOf(b)<b.inst[0].amt)return toast('يلزم سداد العربون '+money(b.inst[0].amt)+' قبل التأكيد');b.st='conf';log('تأكيد الحجز '+b.no)}
 if(a==='done'){if(outOf(b)>0)return toast('لا يمكن إكمال الحجز قبل سداد المتبقي '+money(outOf(b)));b.st='done';log('إكمال الحجز '+b.no)}
 if(a==='cancelb'){post('ع-'+b.no,'عكس قيد إلغاء '+b.no,[[ENT[b.e].cr,b.total,0],['1100',0,b.total]],b.e);b.st='cancel';log('إلغاء '+b.no+' بقيد عكسي')}
 if(a==='voidr'){const r=S.rec.find(x=>x.id===id);post('ع-'+r.no,'عكس سند قبض '+r.no,[['1100',r.amt,0],[r.pm==='cash'?'1010':'1020',0,r.amt]],r.e);r.st='void';log('إلغاء سند '+r.no+' بقيد عكسي')}
 render()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-v],[data-f],[data-doc],[data-svc],[data-rc],[data-close],[data-act],[data-cm]');if(!t)return;
 if(t.dataset.close!==undefined){if(e.target===t||t.tagName==='BUTTON')$('#layer').innerHTML='';return}
 if(t.dataset.cm!==undefined){cm=t.dataset.cm==='0'?0:cm+ +t.dataset.cm;return render()}
 if(t.dataset.act)return act(t.dataset.act,+t.dataset.id);
 if(t.dataset.v==='theme'){const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark';return}
 if(t.dataset.v==='reset'){seed();return render()}
 if(t.dataset.v){view=t.dataset.v;render()}else if(t.dataset.f){flt=t.dataset.f;render()}
 else if(t.dataset.doc)docB(+t.dataset.doc);else if(t.dataset.svc)svcB(+t.dataset.svc);else if(t.dataset.rc)recB(+t.dataset.rc)});
document.addEventListener('change',e=>{if(e.target.id==='role'){role=e.target.value;render()}});
document.addEventListener('submit',e=>{e.preventDefault();const id=e.target.id,v=x=>$('#'+x).value;
 if(id==='fl'){if(!can('lock'))return;S.lock=v('l-d');log('تحديد تاريخ الإقفال: '+(S.lock||'مفتوحة'));toast(S.lock?'تم إقفال الفترة':'تم فتح الفترة');return render()}
 if(!guard())return;
 if(id==='fb'){const en=v('b-e');let a;if(en==='Z'){a=v('b-a').split(/[,،]/).map(s=>s.split(':')).filter(x=>x[1]&&+x[1]>0).map(x=>[x[0].trim(),+x[1]]);if(!a.length)return toast('اكتب الخدمات بصيغة: اسم:سعر')}else a=+v('b-a');
  const tot=en==='Z'?a.reduce((x,i)=>x+i[1],0):a,pd=+v('b-r');if(pd>tot)return toast('العربون أكبر من إجمالي العقد');
  if(en==='L'&&S.book.some(b=>b.e==='L'&&b.st!=='cancel'&&b.date===v('b-d')))return toast('القاعة محجوزة في هذا التاريخ');
  const b=mkBook(en,v('b-n'),v('b-p'),v('b-i'),v('b-d'),v('b-k'),a,pd,v('b-m'));toast('تم إصدار '+b.no+' · '+STAT[b.st][0]);render()}
 if(id==='fr'){const bid=+v('r-b'),amt=+v('r-a');if(!bid)return;const b=S.book.find(x=>x.id===bid);if(amt>outOf(b))return toast('المبلغ أكبر من المتبقي على العقد');mkRec(bid,amt,v('r-m'));toast('تم إصدار سند القبض');render()}
 if(id==='fe'){addExp(v('e-t'),+v('e-a'),v('e-c'),v('e-m'),v('e-e'));toast('تم تسجيل المصروف');render()}});
load();render();
</script>
